[project]
name = "predval"
version = "0.0.0"
description = "Predictions-in validation harness for clinical prediction models"
readme = "README.md"
# The brief called for 3.11+, but exact pinning forces 3.12+: the pinned numpy requires it, and
# a universal resolution across 3.11 would need a second, different numpy for that one version.
# Single exact pins matter more here than 3.11 support -- a metric that moves because a
# transitive dependency forked by interpreter version is a metric nobody can audit.
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

# Pinned exactly. predval is a measurement instrument: a metric that moves because a
# transitive dependency changed is indistinguishable from a metric that moves because the
# model changed. Exact pins keep those two causes separable.
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.0",
    "statsmodels==0.14.6",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]
# dcurves is deferred to S3 (decision curves), and lands with a fallback net_benefit
# implementation so the harness still runs if it is unavailable.

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
