# IMPROVE neoepitope immunogenicity cohort -- predval's first non-imaging, non-clinical fixture.
#
# 17,520 candidate neoepitopes from 70 patients (bladder, melanoma and a mixed "Basket" cohort),
# each with an experimentally determined T-cell recognition outcome; 467 are immunogenic
# (2.666% prevalence). Source: Borch et al. 2024, "IMPROVE: a feature model to predict
# neoepitope immunogenicity through broad-scale validation of T-cell recognition",
# Frontiers in Immunology, data release github.com/SRHgroup/IMPROVE_paper (results.zip).
#
# The predictions are the out-of-fold scores from that paper's own 5-fold cross-validation,
# which was partitioned BY PATIENT: every patient sits in exactly one partition, so no
# prediction here was produced by a model that had seen another peptide from the same patient.
# That is what makes the file admissible as a predictions-only validation input rather than
# an apparent-fit artefact.
#
# Regenerate the parquet files with:
#     uv run python examples/improve/build_fixture.py --src <extracted 'results copy' dir>

cohort_id: improve-neoepitope-cv-patient-grouped
version: 0
subject_key: subject_id
data: cohort.parquet

outcome:
  type: binary
  field: response
  positive_label: 1

# A candidate neoepitope is not a patient. These 17,520 peptides come from 70 patients, and
# peptides from one patient share that patient's HLA genotype, mutational process, tumour
# transcriptome and TME -- the dominant sources of variance in every feature these models use.
# Uncertainty therefore has to be computed over patients. This is the direct analogue of PCam's
# 22 slides, with a much larger mean cluster size (250 peptides per patient).
#
# unit_noun is the unit of OBSERVATION (one row = one candidate peptide-HLA pair);
# clustering.name is the unit of INDEPENDENCE (one patient).
unit_noun: peptide

clustering:
  field: patient
  name: patient

coverage:
  min_fraction: 0.95
  compare_on: both

completeness:
  require_outcome: true
  on_violation: drop_and_report

# Prespecified, both chosen before any metric was computed on this cohort.
#
# tumour_cohort: the release's own three accrual groups (bladder n=6,237/24 patients;
#   melanoma n=5,921/26; Basket n=5,362/20). A selection model that holds in melanoma -- the
#   indication these predictors were overwhelmingly trained and tuned on -- and fails elsewhere
#   is precisely the failure mode that matters for MSS colorectal disease, which is not in this
#   cohort at all. This subgroup is the closest available proxy for that transfer question and
#   its result bounds how far any verdict here may be carried.
#
# peptide_length: 9-mers versus everything else. Peptide-HLA binding predictors, which supply
#   the dominant features (RankEL, RankBA, Stability), are trained overwhelmingly on 9-mers and
#   are known to degrade off that length. Declared because the off-length stratum is where a
#   calibration fault would be expected a priori, not because it was observed.
subgroups:
  - name: tumour_cohort
    field: tumour_cohort
  - name: peptide_length
    field: peptide_length

# 0.5 is the nominal probability-scale decision threshold and is reported because it is what a
# naive consumer of these scores would use. It is the wrong threshold for this problem -- see
# the budgeted-yield sidecar (examples/improve/budget_yield.py), which treats selection as
# top-k under a 3-20 antigen slot budget rather than as thresholding -- but a threshold the
# field would actually reach for is worth measuring before replacing it.
thresholds: [0.5]

uncertainty:
  n_boot: 2000
  seed: 1337
  ci_level: 0.95
  show_naive_ci: true

# Roster: 7 declared, 7 expected present.
#
# Six are the IMPROVE random forest itself, in the three feature configurations the paper
# releases (Simple; TME_excluded, which adds cellular prevalence and a prioritisation score;
# TME_included, which further adds cytolytic activity, HLA expression and MCP-counter TME
# estimates), each in its full form and in the `wo_prime` ablation that drops the PRIME feature.
# The seventh, `nnalign`, is the paper's NNAlign comparator -- a different model class trained
# against a 0.001/1.0 target encoding, which is why its scores live on a different numeric scale
# and why including it is informative rather than redundant.
expected_models:
  - improve_simple
  - improve_simple_wo_prime
  - improve_tme_excl
  - improve_tme_excl_wo_prime
  - improve_tme_incl
  - improve_tme_incl_wo_prime
  - nnalign
on_missing_model: fail

# Empty, deliberately, and the reasoning is worth recording because a random forest invites the
# opposite answer. predval's `ensemble_members` flags a model_id whose predictions are a blend
# of SEVERAL SEPARATELY TRAINED MODELS, because such a blend's apparent performance is inflated
# by the selection of its own weights. An IMPROVE random forest is one trained model whose
# internal bagging is part of its fitting procedure, not a post-hoc blend over a roster -- the
# same reason a gradient-boosted model is not declared here either. No member of this roster is
# a blend, so the ensemble-construction-bias caution correctly does not appear.
ensemble_members: []
