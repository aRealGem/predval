# PatchCamelyon holdout cohort -- the predval example fixture.
#
# 19,999 histopathology image patches drawn from 22 whole-slide images, held out by slide
# (GroupShuffleSplit, test_size=0.10, seed 1337) so that no slide appears in both training and
# holdout. Outcome: does the centre 32x32 region of the patch contain tumour tissue.
#
# Regenerate the parquet files with:
#     uv run python examples/pcam/build_fixture.py

cohort_id: pcam-holdout-wsi-grouped
version: 0
subject_key: subject_id
data: cohort.parquet

outcome:
  type: binary
  field: label
  positive_label: 1

# A patch is not a patient. These 19,999 patches come from 22 slides, and patches from one
# slide are heavily correlated, so uncertainty must be computed over slides rather than over
# patches. See docs/spec.md section 2.1.
clustering:
  field: wsi
  name: slide

coverage:
  min_fraction: 0.95
  compare_on: both

completeness:
  require_outcome: true
  on_violation: drop_and_report

# Prespecified. The K=2 clustering separates the slides into two stain/scanner groups, splitting
# the holdout 11/11 slides and 10,554/9,445 patches. The question it asks is the one a
# validation harness exists to ask: does the model hold up across scanners?
subgroups:
  - name: scanner_domain
    field: domain

thresholds: [0.5]

uncertainty:
  n_boot: 2000
  seed: 1337
  ci_level: 0.95
  show_naive_ci: true

# Roster count, reconciled: 16 declared / 15 present / 1 absent. The 15 present are the 14 files
# in autoloop/members/ plus `p4m_reg_vl` recovered from autoloop/inbox/ -- the S0 note's "all 14"
# counted only the members/ directory and missed the recovered file. `p4m_reg` is the 16th,
# declared but permanently lost (its .keras weights lived in ephemeral Colab storage), so it is
# the one absent id. Declaring `p4m_reg` is the point: it makes the gap appear as a flag in every
# report instead of the model quietly not existing. The remaining ids are probed members
# evaluated but not promoted -- declaring them keeps present-but-undeclared meaningful.
#
# RENAMED S6.1 (2026-08-28): `champion` is now `mobilenetv3`, its true architecture (verified
# against the campaign repo's state.json members["champion"]: jobid job0b, solo OOF AUROC
# 0.916338; README.md's "MobileNetV3-Small (ImageNet) transfer baseline"; and
# notebooks/autoloop_colab.py's _CKPT_ALIASES mapping "champion" -> "mobilenetv3" -- three
# independent sources agreeing). S6 (2026-08-26) had already corrected the DOCUMENTATION that
# wrongly called `champion` an 11-member ensemble; this session removes the misleading name
# itself. `mobilenetv3` is collision-free (no other roster member is MobileNetV3).
#
# The campaign separately, and confusingly, reuses the word "champion" for its CURRENT BEST
# recipe -- state.json's top-level `state["champion"]`, an unrelated 11-member weighted blend
# (private LB 0.9761) that happens to include `mobilenetv3` as one of its 11 ingredients at
# weight 0.0672. This session ATTEMPTED to export that real blend as its own fixture member --
# the math is read-only-computable (a pure weighted average over each member's own OOF
# predictions, per autoloop/blend_opt.py's `_blend()`) -- and it is BLOCKED: one of the 11
# ingredients, `p4m_reg`, has no OOF file anywhere (state.json: `"oof": null`, `"note": "...OOF
# also lost (no staged oof)"`), the exact same permanent loss recorded above for the roster gap.
# The blend cannot be computed from what is on disk. Consequence: this fixture's roster contains
# ZERO members that are actually ensembles/blends -- `ensemble_members` below is correctly empty,
# and the report's ensemble-construction-bias caution (docs/spec.md section 9) no longer appears
# for PCam, same as it never has for GUSTO. This is a real, correctly-derived outcome of the
# investigation, not an oversight.
expected_models:
  - mobilenetv3
  - tinyvgg
  - p4m_reg
  - p4m_reg_vl
  - p4m_seed7
  - p4m_dense
  - e2cnn
  - e2cnn_s21
  - e2cnn_s99
  - swin
  - phikon
  - macenko
  - tinyvgg_vl
  - p4m_s13
  - p4m_svm
  - effnet_scratch
on_missing_model: warn

# No fixture member is a known ensemble/blend (see above) -- explicitly empty rather than
# omitted, since the point of this fixture is to document its own provenance, not stay silent.
ensemble_members: []
