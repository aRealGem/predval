# GUSTO-I non-West holdout cohort -- predval's second worked example.
#
# 38,642 acute-MI patients enrolled outside the "West" region of the GUSTO-I trial (n=40,830
# total; West = regl==1, n=2,188). Outcome: death within 30 days. The single model here is a
# standard 8-predictor logistic (age>65, female, diabetes, hypotension, tachycardia, high-risk
# [anterior or prior MI], shock, time-to-relief>1h) fit on the West subset ONLY and scored on
# every non-West patient -- geographic external validation, the same shape as validating a
# single-site model against an outside cohort.
#
# Regenerate with:
#     uv run --group examples python examples/gusto/make_predictions.py
#
# See docs/DELTA-gusto.md for the region-code evidentiary basis and predictor verification.

cohort_id: gusto1-nonwest-external-validation
version: 0
subject_key: subject_id
data: cohort.parquet

outcome:
  type: binary
  field: label
  positive_label: 1

# unit_noun is the unit of OBSERVATION (one row = one patient: 38,642 rows, 38,642 distinct
# subject_ids); clustering.name is the unit of INDEPENDENCE (one enrollment region). Declaring
# both keeps this cohort's prose in its own vocabulary rather than inheriting the imaging
# fixture's "patch"/"slide" or falling back to a generic "row" (S6.2 D1, S6.3 A2).
unit_noun: patient

# regl is GUSTO-I's enrollment-region code: 16 levels across the full trial, of which exactly 15
# appear in this scored cohort (codes 2-16; the West development region regl == 1 is held out).
# Patients enrolled through the same regional network are not independent -- the same reason PCam
# clusters by slide, here it is by region rather than an imaging artifact.
clustering:
  field: regl
  name: region

coverage:
  min_fraction: 0.95
  compare_on: both

completeness:
  require_outcome: true
  on_violation: drop_and_report

thresholds: [0.5]

uncertainty:
  n_boot: 2000
  seed: 1337
  ci_level: 0.95
  show_naive_ci: true

# A roster of one. Declaring it is not decoration -- it is what makes a scoring failure (had one
# occurred) a loud flag instead of a report that quietly has no rows.
expected_models:
  - gusto_west_refit_logistic
on_missing_model: warn
