# DORMANT. This repository has no remote, so nothing runs this workflow yet. It is committed
# now so that CI is not an afterthought if the project is ever published.
#
# Note the PCam fixture tests are excluded here: they read a local campaign directory that
# exists only on the machine the fixture was built from. They are expected to skip in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync pinned dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
