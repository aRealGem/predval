# DORMANT. This repository has no remote, so nothing runs this workflow yet. It is committed
# now so that CI is not an afterthought if the project is ever published.
#
# Note the PCam fixture tests are excluded here: they read a local campaign directory that
# exists only on the machine the fixture was built from. They are expected to skip in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync pinned dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
